# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{311-314}-{pyqt6,pyside6}, py312-pyqt5

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
QT_PACKAGE =
    pyqt6: pyqt6
    pyside6: pyside6
    pyqt5: pyqt5

[testenv]
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
    QT_PACKAGE
dependency_groups =
    dev

commands = pytest -v --color=yes --cov=napari_animation --cov-report=xml

[testenv:py{311-314}-pyqt6]
deps =
    napari[pyqt6]

[testenv:py{311-314}-pyside6]
deps =
    napari[pyside6]
    py311: PySide6!=6.12.0

[testenv:py312-pyqt5]
deps =
    napari[pyqt5]==0.9.2

# This workflows will upload a Python Package using Trusted Publishing when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: tests

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Pre-commit (all files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  build-and-inspect-package:
    name: Build & inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }} ${{ matrix.qt_package }}
    runs-on: ${{ matrix.platform }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [ "3.10", "3.12", "3.14" ]
        qt_package: [pyqt6]
        include:
          # Keep small legacy/backend smoke tests; PyQt6 covers the main grid.
          - platform: ubuntu-latest
            python-version: "3.12"
            qt_package: pyside6
          - platform: windows-latest
            python-version: "3.12"
            qt_package: pyside6
          - platform: ubuntu-latest
            python-version: "3.12"
            qt_package: pyqt5
          - platform: windows-latest
            python-version: "3.12"
            qt_package: pyqt5
          - platform: ubuntu-latest
            python-version: "3.10"
            qt_package: pyside2
          - platform: windows-latest
            python-version: "3.10"
            qt_package: pyside2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: tlambert03/setup-qt-libs@19e4ef2d781d81f5f067182e228b54ec90d23b76 # v1.8
      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1
          if (Test-Path -Path "C:\Windows\system32\opengl32.dll" -PathType Leaf) {Exit 0} else {Exit 1}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools tox tox-gh-actions

      # this runs the platform-specific tests declared in tox.ini
      - name: Test with tox
        uses: aganders3/headless-gui@f85dd6316993505dfc5f21839d520ae440c84816 # v2.2
        with:
            run: tox
        env:
          PLATFORM: ${{ matrix.platform }}
          TOX_TESTENV_PASSENV: "QT_PACKAGE"
          QT_PACKAGE: ${{ matrix.qt_package }}

      - name: Coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.14' && matrix.qt_package == 'pyqt6'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true

  deploy:
    name: Deploy to PyPI
    # this will run when you have tagged a commit, starting with "v*"
    # and requires that you have setup PyPI Trusted Publishing
    # (see https://docs.pypi.org/trusted-publishers/adding-a-publisher/)
    needs: [ ruff, test, build-and-inspect-package ]
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/napari-animation
    if: contains(github.ref, 'tags')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools setuptools_scm
      - name: Build python package
        run: |
          git tag
          python -m build
      - name: Publish package distributions to PyPI
        # This action uploads everything from the dist/ folder to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
